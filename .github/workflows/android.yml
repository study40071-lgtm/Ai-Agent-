name: Build Android APK

'on':
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Verify ZIP exists
    run: |
      if [ ! -f "VideoPilot-Android-Project.zip" ]; then
        echo "ERROR: VideoPilot-Android-Project.zip not found"
        exit 1
      fi

  - name: Extract Android project
    run: |
      mkdir -p project
      unzip -o VideoPilot-Android-Project.zip -d project

  - name: Set up Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Check Android project files
    run: |
      find project -maxdepth 4 -type f
      if [ ! -f "project/settings.gradle" ]; then
        echo "ERROR: settings.gradle not found"
        exit 1
      fi
      if [ ! -f "project/app/build.gradle" ]; then
        echo "ERROR: app/build.gradle not found"
        exit 1
      fi

  - name: Build debug APK
    working-directory: project
    run: gradle assembleDebug

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: VideoPilot-debug-apk
      path: project/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
```
