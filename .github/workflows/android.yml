
name: Build Android APK

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project ZIP
        run: |
          test -f VideoPilot-Android-Project.zip

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o VideoPilot-Android-Project.zip -d project

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoPilot-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
